; HS300 attack relay box - YD-ESP32-C3-4IN4OUT (vcc-gnd). Build + flash: pio run -t upload
; Same platform/framework as the converter agent (dc_dc_g474_batt_mppt/esp32).
[env:yd_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient @ ^2.8
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; over-the-air, once the USB build with ArduinoOTA is on the box
[env:yd_esp32c3_ota]
extends = env:yd_esp32c3
upload_protocol = espota
upload_port = hs300relay.local
upload_flags = --auth=SET_YOUR_OWN
